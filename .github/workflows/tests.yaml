name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        version: 0.28.0
        caps-version: 0.1.1

    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Check snapshot formatting
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru

    - name: Report static type coverage
      run: |
        calcit calcit.cirru --strict-types --check-only
        calcit calcit.cirru --entry test --strict-types --check-only
        calcit calcit.cirru analyze check-public --ns bisection-key.core --ns bisection-key.util --summary-only --format json
        calcit calcit.cirru test --require-match
        calcit calcit.cirru analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --entry test analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs format-md docs/quality-gate.md --check
        calcit calcit.cirru docs check-md README.md --failures-only
        calcit calcit.cirru docs check-md docs/quality-gate.md --failures-only

    - name: Enforce zero static type debt
      run: calcit calcit.cirru analyze quality --format json

    - name: "test calcit"
      run: calcit calcit.cirru --entry test

    - name: "test js"
      run: calcit calcit.cirru --entry test js && node test.mjs

    - name: "test wasm"
      run: yarn test:wasm
