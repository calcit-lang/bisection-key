name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1

    - name: Install deps
      run: caps --ci && yarn install --immutable

    - name: Check snapshot formatting
      run: |
        cr calcit.cirru edit format
        git diff --exit-code -- calcit.cirru

    - name: Report static type coverage
      run: |
        cr calcit.cirru analyze check-types --summary-only --format json
        cr calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        cr calcit.cirru docs format-md README.md --check
        cr calcit.cirru docs format-md docs/quality-gate.md --check
        cr calcit.cirru docs check-md README.md --failures-only
        cr calcit.cirru docs check-md docs/quality-gate.md --failures-only

    - name: Enforce static type-quality baseline
      run: cr calcit.cirru analyze quality --baseline config/calcit-quality.json --format json

    - name: "test cr"
      run: cr calcit.cirru --entry test

    - name: "test js"
      run: cr calcit.cirru --entry test js && node test.mjs
